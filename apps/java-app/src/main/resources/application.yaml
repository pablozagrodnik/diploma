spring:
  application:
    name: java-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: "prometheus"
      base-path: "/"
      path-mapping:
        prometheus: "metrics"

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG

server:
  port: 8080
