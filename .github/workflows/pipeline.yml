name: Thesis Tests

on:
  workflow_dispatch:

jobs:
  setup_base:
    runs-on: ubuntu-latest
    outputs:
      db_ip: ${{ steps.get_ip.outputs.DB_IP }}
      run_id: ${{ steps.set_run_id.outputs.RUN_ID }}
    steps:
      - name: Set Run ID
        id: set_run_id
        run: echo "RUN_ID=$(date +"%m-%d_%H-%M")" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
      - name: Terraform Apply - base
        working-directory: infra/base
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Extract DB IP
        id: get_ip
        working-directory: infra/base
        run: |
          IP=$(terraform output -raw postgres_private_ip)
          echo "DB_IP=$IP" >> $GITHUB_OUTPUT

  run_tests:
    needs: setup_base
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        runtime: [ java-jit, go ]
        test_type: [ stress ]
    #       runtime: [ java-jit, java-native, go ]
    #       test_type: [idle, constant, linear, spike, stress]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin,kubectl'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
      - uses: azure/setup-helm@v4

      - name: Terraform Apply - modules
        working-directory: infra/modules
        run: |
          terraform init
          terraform apply -auto-approve

      - name: GKE Config & Deploy App
        working-directory: infra/modules
        env:
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          gcloud container clusters get-credentials $CLUSTER_NAME --zone=europe-central2-a
          
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          helm uninstall thesis-api --ignore-not-found --wait
          kubectl delete svc thesis-api --ignore-not-found --wait
          
          helm upgrade --install thesis-api ../../k8s/thesis-api \
            --set image.repository=ghcr.io/$REPO/thesis-api-${{ matrix.runtime }} \
            --set image.tag=latest \
            --set env.DB_HOST=${{ needs.setup_base.outputs.db_ip }} \
            --set env.DB_USER=postgres \
            --set env.DB_PASSWORD=$DB_PASS

      - name: Internal Load Balancer IP
        run: |
          APP_IP=""
          while [ -z "$APP_IP" ]; do
            sleep 6
            APP_IP=$(kubectl get svc -l app.kubernetes.io/instance=thesis-api -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          done
          echo "APP_IP=$APP_IP" >> $GITHUB_ENV

      - name: Wait for LB
        run: |
          while ! curl -s -o /dev/null -w "%{http_code}" http://${{ env.APP_IP }}/health | grep -q "200"; do
            echo "Waiting for LoadBalancer"
            sleep 5
          done

      - name: Run Test Iterations
        run: |
          gcloud compute scp --quiet --recurse tools runner@tools-vm:~/ --zone=europe-central2-a --tunnel-through-iap
          
          ITERATIONS=2
          
          for i in $(seq 1 $ITERATIONS); do
            echo "---$i - ${{ matrix.runtime }}---"
          
            kubectl rollout restart deployment thesis-api
            kubectl rollout status deployment thesis-api --timeout=120s

            gcloud compute ssh runner@tools-vm --quiet --zone=europe-central2-a --tunnel-through-iap \
              --command="chmod +x ~/tools/run_test.sh && bash ~/tools/run_test.sh ${{ env.APP_IP }} ${{ matrix.runtime }} ${{ matrix.test_type }} ${i}"
                
            gcloud compute scp runner@tools-vm:~/tools/results/${{ matrix.test_type }}_iter_${i}_k6.csv runner@tools-vm:~/tools/results/${{ matrix.test_type }}_iter_${i}.json  . --zone=europe-central2-a --tunnel-through-iap
            gcloud storage cp ${{ matrix.test_type }}_iter_${i}_k6.csv ${{ matrix.test_type }}_iter_${i}.json  gs://thesis-test-results/run-${{ needs.setup_base.outputs.run_id }}/${{ matrix.runtime }}/${{ matrix.test_type }}/
          done
          
          curl -s -X POST http://${{ env.APP_IP }}/teardown


