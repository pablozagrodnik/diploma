name: Thesis Tests

on:
  workflow_dispatch:

jobs:
  setup_base:
    runs-on: ubuntu-latest
    outputs:
      db_ip: ${{ steps.get_ip.outputs.DB_IP }}
      run_id: ${{ steps.set_run_id.outputs.RUN_ID }}
      cluster_name: ${{ steps.apply_modules.outputs.CLUSTER_NAME }}
    steps:
      - name: Set Run ID
        id: set_run_id
        run: echo "RUN_ID=$(date +"%m-%d_%H-%M")" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '568.0.0'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
      - name: Terraform Apply - base
        working-directory: infra/base
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Extract DB IP
        id: get_ip
        working-directory: infra/base
        run: |
          IP=$(terraform output -raw postgres_private_ip)
          echo "DB_IP=$IP" >> $GITHUB_OUTPUT

      - name: Terraform Apply - modules
        id: apply_modules
        working-directory: infra/modules
        run: |
          terraform init
          terraform apply -auto-approve
          CLUSTER=$(terraform output -raw cluster_name)
          echo "CLUSTER_NAME=$CLUSTER" >> $GITHUB_OUTPUT

      - name: Upload Tools to VM
        run: |
          gcloud compute scp --quiet --recurse tools runner@tools-vm:~/ --zone=europe-central2-a --tunnel-through-iap
          gcloud compute ssh runner@tools-vm --quiet --zone=europe-central2-a --tunnel-through-iap \
            --command="chmod +x ~/tools/run_test.sh ~/tools/init_monitoring.sh && ~/tools/init_monitoring.sh"

  run_tests:
    needs: setup_base
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        test_type: [ idle, cpu_constant, db_constant, cpu_linear, db_linear, cpu_spike, db_spike, cpu_stress, db_stress ]
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '568.0.0'
          install_components: 'gke-gcloud-auth-plugin,kubectl'

      - uses: azure/setup-helm@v4

      - name: Run Scenario Across All Runtimes
        env:
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_IP: ${{ needs.setup_base.outputs.db_ip }}
          CLUSTER_NAME: ${{ needs.setup_base.outputs.cluster_name }}
          RUN_ID: ${{ needs.setup_base.outputs.run_id }}
          TEST_TYPE: ${{ matrix.test_type }}
          GITHUB_REPO: ${{ github.repository }}
        run: bash .github/scripts/run_scenario.sh


  teardown_base:
    needs: [setup_base, run_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '568.0.0'
          install_components: 'gke-gcloud-auth-plugin,kubectl'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - uses: azure/setup-helm@v4
      - name: Terraform Destroy - modules
        if: always()
        working-directory: infra/modules
        run: |
          terraform init
          CLUSTER_NAME=$(terraform output -raw cluster_name || true)
          if [ -n "$CLUSTER_NAME" ]; then
            gcloud container clusters get-credentials "$CLUSTER_NAME" --zone=europe-central2-a || true
            helm uninstall thesis-api --ignore-not-found --wait || true
          fi
          terraform destroy -auto-approve

      - name: Terraform Destroy - base
        working-directory: infra/base
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform init
          terraform destroy -auto-approve