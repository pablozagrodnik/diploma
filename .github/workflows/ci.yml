name: Build and Push Images
on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runtime: java-jit
            dir: java-app
            dockerfile: Dockerfile
#          - runtime: java-native
#            dir: java-app
#            dockerfile: Dockerfile.native
          - runtime: go
            dir: go-app
            dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.dir }}
          file: ./apps/${{ matrix.dir }}/${{ matrix.dockerfile }}
          push: ${{ !env.ACT }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/thesis-api-${{ matrix.runtime }}:latest